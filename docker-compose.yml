version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tabibak-db
    environment:
      POSTGRES_DB: tabibak
      POSTGRES_USER: tabibak_user
      POSTGRES_PASSWORD: tabibak_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabibak_user -d tabibak"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
